<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --title-bg: linear-gradient(135deg, #b2ebf2 0%, #81d4fa 100%);
            --title-text: #0c4a6e;
            --primary-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent: #fbbf24;
            --main-text: #1e3a8a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--primary-bg);
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: 'Assistant', sans-serif; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden; color: #334155;
        }

        .header-wrapper { height: 12vh; display: flex; justify-content: center; align-items: center; padding: 0 1vw; }
        .header-bubble {
            width: 98%; height: 9vh; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 25px;
            display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 0 2vw; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-right { text-align: right; font-size: 1.9vw; font-weight: 800; color: var(--accent); }
        .header-center { text-align: center; display: flex; align-items: center; justify-content: center; gap: 25px; color: white; }
        #live-clock, #live-date { font-size: 2.8vw; font-weight: 800; line-height: 1; letter-spacing: 1px; }
        .separator { width: 3px; height: 4vh; background: rgba(255,255,255,0.3); border-radius: 2px; }
        .header-left { text-align: left; font-size: 1vw; color: white; opacity: 0.5; font-weight: 700; }

        .stage { height: 83vh; display: flex; gap: 1.2vw; padding: 1.5vh; }
        .side-col-left { width: 25%; display: flex; flex-direction: column; gap: 1.5vh; height: 100%; }
        .center-col { width: 57%; display: flex; flex-direction: column; }
        .side-col-weather { width: 18%; display: flex; flex-direction: column; gap: 1.5vh; }

        .card { background: var(--card-bg); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card-header { background: var(--title-bg); color: var(--title-text); height: 6vh; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4vw; flex-shrink: 0; }

        #events-list { flex: 1; padding: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .event-item {
            background: #f8fafc; padding: 12px; border-radius: 12px; border-right: 6px solid #0ea5e9;
            margin-bottom: 8px; display: flex; align-items: center; font-size: 1.35vw;
        }
        .event-date-pill { color: #0ea5e9; font-weight: 800; margin-left: 8px; white-space: nowrap; }
        .event-text { font-weight: 800; color: var(--main-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .msg-bubble { background: white; padding: 18px; border-radius: 15px; border-right: 8px solid var(--accent); margin-bottom: 15px; font-size: 1.9vw; font-weight: 700; color: #1e40af; line-height: 1.3; }

        /* פרסומת דוגווקר */
        .dog-promo { flex: 2.2; background: #f0fdf4; border: 2px solid #22c55e; display: flex; flex-direction: column; }
        .slider-container { flex: 3.5; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #e0f2fe; }
        .dog-text { flex: 1.5; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0.5vh; text-align: center; color: #14532d; font-size: 1.35vw; font-weight: 800; }
        .dog-phone { background: #22c55e; color: #ffffff; padding: 0.4vh 1.4vw; border-radius: 50px; font-size: 1.5vw; font-weight: 900; margin-top: 0.4vh; box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3); }

        .qr-img-styled { background: white; padding: 5px; border-radius: 8px; border: 1px solid #ddd; display: block; }
        .promo-footer { background: #fff; padding: 1.2vh; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 2px dashed #22c55e; flex-shrink: 0; }
        .promo-footer-text { font-size: 1.3vw; font-weight: 800; color: var(--main-text); line-height: 1.2; text-align: right; }

        .qr-section { background: #f0f9ff; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 2px solid #bae6fd; margin-top: auto; }
        .qr-text { font-size: 1.2vw; font-weight: 900; color: #0369a1; text-align: center; }

        .w-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 8px; flex: 1; min-height: 0; }
        .w-item { background: #f1f5f9; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; overflow: hidden; }
        .w-temp { font-size: 2.3vw; font-weight: 900; color: var(--main-text); line-height: 1; }
        .w-icon { font-size: 2.2vw; line-height: 1; margin: 2px 0; }
        .w-day { font-size: 1vw; font-weight: 800; color: #64748b; margin-bottom: 2px; }

        .shabbat-row { padding: 1vh 1vw; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2vw; color: var(--main-text); }

        .footer { height: 5vh; background: white; width: 100vw; display: flex; align-items: center; overflow: hidden; position: relative; border-top: 2px solid #ee2d24; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker-loop 200s linear infinite; font-size: 1.9vw; font-weight: 800; color: #ee2d24; }
        @keyframes ticker-loop { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }
        .ynet-tag { background: #ee2d24; color: white; font-weight: 900; font-size: 1.8vw; width: 110px; height: 100%; display: flex; align-items: center; justify-content: center; position: absolute; right: 0; top: 0; z-index: 10; }
        .emergency { background: #ef4444; color: white; padding: 1vh; text-align: center; font-size: 1.6vw; font-weight: 900; }

        #keep-awake-video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

<div class="header-wrapper">

<div class="stage">

<div class="footer">

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhGwGPiqNXmESzkgh6oW-KDGlgMaBoIiYDd0ennIUNlOwVQH2F7DWIDyZ6Fe_3wrcY/exec';

    /* ============================================================
       Resilience layer
       Goal: a momentary internet drop must NEVER leave the board
       stuck on the browser's own "no internet" page, and must never
       hand control over to the TV's system screensaver instead of
       just quietly retrying in the background.
       ============================================================ */

    // fetch() with a hard timeout, so a stalled/half-open connection
    // during flaky connectivity can't hang forever and pile up.
    function fetchWithTimeout(url, options, timeoutMs) {
        options = options || {};
        timeoutMs = timeoutMs || 10000;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, { ...options, signal: controller.signal, cache: 'no-store' }).finally(() => clearTimeout(timer));
    }

    // Never let it crash out silently — log and keep going instead.
    window.addEventListener('error', (e) => console.warn('board error (ignored):', e.message));
    window.addEventListener('unhandledrejection', (e) => console.warn('board promise error (ignored):', e.reason));

    // Screen Wake Lock: actively ask the system to keep the display on,
    // so the TV/TVBRO is less likely to hand off to a screensaver.
    let wakeLock = null;
    function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        navigator.wakeLock.request('screen').then((lock) => { wakeLock = lock; }).catch(() => { /* not supported/allowed here - the keep-awake video is the fallback */ });
    }
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();
    setInterval(requestWakeLock, 60000); // some systems silently release the lock - keep reasserting it

    // Full-page reload is the one thing that can trigger the browser's own
    // offline interstitial, so only ever do it when we've actually confirmed
    // we're online - otherwise just try again shortly instead of navigating away.
    function safeReload() {
        if (navigator.onLine === false) { setTimeout(safeReload, 30000); return; }
        fetchWithTimeout(SCRIPT_URL + '?ping=' + Date.now(), {}, 6000)
            .then(() => location.reload())
            .catch(() => setTimeout(safeReload, 30000));
    }
    // Full JS/DOM/GPU-layer reset once an hour (while genuinely online). This is
    // the main defense against slow multi-day resource leaks (memory, GPU
    // compositing layers, decoders) that otherwise build up over a week of
    // continuous uptime and can end in a full device freeze needing a physical
    // power-cycle. A quick reload flash once an hour is a small price for that.
    // (This file previously had NO periodic reload at all - if it was the one
    // left running for days as the default/idle display, that alone could
    // explain a crash that only clears with a physical unplug.)
    const RELOAD_INTERVAL_MS = 60 * 60 * 1000;
    setTimeout(safeReload, RELOAD_INTERVAL_MS);

    // Extra insurance: on Chromium-based WebViews, performance.memory exposes
    // JS heap stats. If usage climbs unusually high between scheduled reloads,
    // reload proactively rather than waiting for an actual out-of-memory freeze.
    function checkMemoryWatchdog() {
        if (!(window.performance && performance.memory)) return;
        const used = performance.memory.usedJSHeapSize;
        const limit = performance.memory.jsHeapSizeLimit;
        if (limit && used / limit > 0.85) {
            console.warn('memory watchdog: heap usage high (' + Math.round(used / 1048576) + 'MB) - reloading proactively');
            safeReload();
        }
    }
    setInterval(checkMemoryWatchdog, 5 * 60 * 1000);

    // The moment connectivity returns, refresh content immediately instead of
    // waiting for the next interval.
    window.addEventListener('online', () => { updateData(); fetchExternal(); fetchNews(); });

    // Register a tiny service worker (see sw.js) so that if a reload is ever
    // attempted at the exact moment the connection is down, the last good
    // copy of this page is served instead of a browser "no internet" page.
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* not fatal - board still works without it */ });
    }

    /* ============================================================
       Clock
       ============================================================ */
    function updateDateTime() {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('live-date').innerText = now.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'2-digit'});
    }

    /* ============================================================
       Data (all fetches defensive: timeout + try/catch, and never
       touch the DOM unless the fetch actually succeeded — so a
       failed refresh just leaves the last good content on screen
       and quietly retries on the next interval)
       ============================================================ */
    async function updateData() {
        try {
            const res = await fetchWithTimeout(SCRIPT_URL + '?t=' + Date.now(), {}, 10000);
            const data = await res.json();
            if (data.messages && data.messages.length > 1) {
                document.getElementById('message-box').innerHTML = data.messages.slice(1).reverse().map(m =>
                    `<div class="msg-bubble">${m.toString().replace(/#/g,'<br>')}</div>`
                ).join('');
            }
            if (data.events) {
                document.getElementById('events-list').innerHTML = data.events.map(e => {
                    const p = e.split('|');
                    if (p.length < 2) return '';
                    let nameClean = p[1].replace(/00:00/g, '').replace(/^[\s:]+/, '').replace('כל היום:', '').trim();
                    let dateClean = p[0].trim().split(' ')[0];
                    return `<div class="event-item"><span class="event-date-pill">${dateClean}</span><span class="event-text">${nameClean}</span></div>`;
                }).join('');
            }
        } catch(e) { console.warn('updateData failed, will retry automatically:', e); }
    }

    async function fetchExternal() {
        try {
            const w = await fetchWithTimeout('https://api.open-meteo.com/v1/forecast?latitude=32.3215&longitude=34.8532&daily=temperature_2m_max,weathercode,sunrise,sunset&timezone=auto', {}, 10000).then(r=>r.json());
            let wHtml = '';
            const daysHeb = ['א\'', 'ב\'', 'ג\'', 'ד\'', 'ה\'', 'ו\'', 'ש\''];
            const todayNum = new Date().getDay();
            for(let i=0; i<4; i++) {
                let icon = w.daily.weathercode[i] < 3 ? '☀️' : (w.daily.weathercode[i] < 50 ? '☁️' : '🌧️');
                wHtml += `<div class="w-item"><span class="w-day">יום ${daysHeb[(todayNum + i) % 7]}</span><div class="w-icon">${icon}</div><div class="w-temp">${Math.round(w.daily.temperature_2m_max[i])}°</div></div>`;
            }
            document.getElementById('weather-4days').innerHTML = wHtml;
            document.getElementById('sun-box').innerHTML = `<div class="shabbat-row"><span>🌅 זריחה</span><span>${w.daily.sunrise?.[0]?.split('T')[1] ?? '--:--'}</span></div><div class="shabbat-row"><span>🌇 שקיעה</span><span>${w.daily.sunset?.[0]?.split('T')[1] ?? '--:--'}</span></div>`;
        } catch(e) { console.warn('weather/sun fetch failed, will retry automatically:', e); }

        try {
            const shabbat = await fetchWithTimeout('https://www.hebcal.com/shabbat?cfg=json&geonameid=293397&m=50', {}, 10000).then(r=>r.json());
            const items = shabbat.items || [];
            const item = items.find(i => i.category === "parashat" || i.category === "holiday");
document.getElementById('parasha-display').innerText = item ? item.hebrew : "שבת";
            const candles = items.find(i=>i.category==="candles")?.title?.split(': ')[1] ?? '--:--';
            const havdalah = items.find(i=>i.category==="havdalah")?.title?.split(': ')[1] ?? '--:--';
            document.getElementById('shabbat-box').innerHTML = `<div class="shabbat-row"><span>🕯️ כניסת שבת</span><span>${candles}</span></div><div class="shabbat-row"><span>✨ צאת שבת</span><span>${havdalah}</span></div>`;
        } catch(e) { console.warn('shabbat fetch failed, will retry automatically:', e); }
    }

    async function fetchNews() {
        try {
            const res = await fetchWithTimeout(`https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ynet.co.il%2FIntegration%2FStoryRss2.xml&t=${Date.now()}`, {}, 10000);
            const data = await res.json();
            if(data.status === 'ok') {
                const newsItems = data.items.map(i => i.title).join("  •  ");
                document.getElementById('news-ticker').innerText = "  •  " + newsItems + "  •  " + newsItems;
            }
        } catch(e) { console.warn('news fetch failed, will retry automatically:', e); }
    }

    setInterval(updateDateTime, 1000);
    setInterval(updateData, 30000);
    setInterval(fetchExternal, 600000);
    setInterval(fetchNews, 60000);
    updateDateTime(); updateData(); fetchExternal(); fetchNews();
</script>
</body>
</html>
